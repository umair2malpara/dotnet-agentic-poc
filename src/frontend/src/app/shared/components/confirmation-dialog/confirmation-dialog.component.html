<dialog
  #dialog
  class="confirmation-dialog"
  aria-labelledby="confirmation-title"
  aria-describedby="confirmation-message"
  aria-modal="true"
  (cancel)="onCancel($event)"
>
  @if (confirmations.request(); as request) {
    <div class="dialog-content">
      <div class="dialog-mark" [class.danger]="request.variant === 'danger'" aria-hidden="true">
        {{ request.variant === 'danger' ? '!' : '?' }}
      </div>
      <h2 id="confirmation-title">{{ request.title }}</h2>
      <p id="confirmation-message">{{ request.message }}</p>
      <div class="dialog-actions">
        <button class="cancel-button" type="button" autofocus (click)="cancel()">
          {{ request.cancelLabel }}
        </button>
        <button
          class="confirm-button"
          [class.danger]="request.variant === 'danger'"
          type="button"
          (click)="confirm()"
        >
          {{ request.confirmLabel }}
        </button>
      </div>
    </div>
  }
</dialog>
