<section class="dashboard-page" aria-label="Dashboard overview">
  <div class="dashboard-meta">
    <div class="today-chip">
      <mat-icon aria-hidden="true">calendar_today</mat-icon>
      <span>{{ today }}</span>
    </div>
  </div>

  <section class="summary-grid" aria-label="Dashboard summary">
    <app-dashboard-stat-card
      label="Forecast days"
      icon="wb_sunny"
      tone="weather"
      [value]="count(weather())"
    />
    <app-dashboard-stat-card
      label="Total customers"
      icon="group"
      tone="customers"
      [value]="count(customers())"
    />
    <app-dashboard-stat-card
      label="Total products"
      icon="inventory_2"
      tone="products"
      [value]="count(products())"
    />
  </section>

  <app-weather-forecast [state]="weather()" (retry)="loadWeather(true)" />

  <div class="detail-grid">
    <app-customer-list [state]="customers()" (retry)="loadCustomers(true)" />
    <app-product-list [state]="products()" (retry)="loadProducts(true)" />
  </div>

  <footer class="page-footer">Dotnet Agentic POC <span>·</span> Dashboard</footer>
</section>
