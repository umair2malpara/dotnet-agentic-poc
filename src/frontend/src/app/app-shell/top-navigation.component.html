<header class="topbar">
  <a
    class="brand"
    routerLink="/dashboard"
    aria-label="Dotnet Agentic POC home"
    (click)="closeMobileNavigation.emit()"
  >
    <span class="brand-mark" aria-hidden="true">D</span>
    <span>Dotnet Agentic POC</span>
  </a>
  <button
    class="desktop-navigation-toggle"
    type="button"
    aria-controls="feature-navigation"
    [attr.aria-expanded]="!desktopNavigationCollapsed()"
    [attr.aria-label]="desktopNavigationCollapsed() ? 'Expand navigation' : 'Collapse navigation'"
    (click)="desktopNavigationToggle.emit()"
  >
    <span aria-hidden="true">☰</span>
  </button>
  <span class="topbar-caption">Operations dashboard</span>
  <button
    #menuButton
    class="menu-toggle"
    type="button"
    aria-controls="feature-navigation"
    [attr.aria-expanded]="mobileNavigationOpen()"
    [attr.aria-label]="mobileNavigationOpen() ? 'Close navigation' : 'Open navigation'"
    (click)="mobileNavigationToggle.emit()"
    (keydown.escape)="closeMobileNavigation.emit()"
  >
    <span class="menu-icon" [class.close-icon]="mobileNavigationOpen()" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </span>
  </button>
</header>
