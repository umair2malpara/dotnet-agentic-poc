<div class="shell" [class.sidebar-collapsed]="desktopNavigationCollapsed()">
  <app-top-navigation
    [mobileNavigationOpen]="mobileNavigationOpen()"
    [desktopNavigationCollapsed]="desktopNavigationCollapsed()"
    (mobileNavigationToggle)="toggleMobileNavigation()"
    (desktopNavigationToggle)="toggleDesktopNavigation()"
    (closeMobileNavigation)="closeMobileNavigation()"
  />

  <div class="layout" [class.navigation-collapsed]="desktopNavigationCollapsed()">
    <app-feature-navigation
      [items]="featureNavigationItems"
      [mobileNavigationOpen]="mobileNavigationOpen()"
      (closeMobileNavigation)="closeMobileNavigation()"
    />

    <main class="content">
      <app-page-context [breadcrumbs]="breadcrumbs()" [context]="pageContext()" />
      <router-outlet (activate)="onPageActivated()" />
    </main>
  </div>

  @if (notifications.notification(); as notification) {
    <div
      class="toast"
      [class.toast-success]="notification.kind === 'success'"
      [class.toast-warning]="notification.kind === 'warning'"
      [class.toast-error]="notification.kind === 'error'"
      [attr.role]="notification.kind === 'success' ? 'status' : 'alert'"
      [attr.aria-live]="notification.kind === 'success' ? 'polite' : 'assertive'"
      aria-atomic="true"
    >
      <p>{{ notification.message }}</p>
      <button type="button" aria-label="Dismiss notification" (click)="notifications.dismiss()">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
  }
  <app-confirmation-dialog />
</div>
