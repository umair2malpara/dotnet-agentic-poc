<mat-card
  class="summary-card"
  [class.weather-summary]="tone() === 'weather'"
  [class.customer-summary]="tone() === 'customers'"
  [class.product-summary]="tone() === 'products'"
>
  <div class="summary-icon"><mat-icon aria-hidden="true">{{ icon() }}</mat-icon></div>
  <div>
    <p class="summary-label">{{ label() }}</p>
    <p class="summary-value">{{ value() }}</p>
  </div>
</mat-card>
