name: Test

on:
  push:
  workflow_call:

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true

      - name: Test
        run: dotnet test ./dotnet-agentic-poc.slnx

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: true
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test -- --watch=false
